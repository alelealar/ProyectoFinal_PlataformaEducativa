<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel administrativo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/styles/style.css}">
</head>
<body>
<main class="mobile-screen">
    <div class="screen-content">
        <header class="top-bar">
            <div class="brand">
                <div class="brand-icon">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <div class="brand-text">
                    <h2>Portal Nexus</h2>
                    <span>Panel administrativo</span>
                </div>
            </div>
            <div class="header-actions">
                <a th:href="@{/logout}" title="Cerrar sesión" style="color:inherit;text-decoration:none;">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </a>
            </div>
        </header>

        <div class="administrador-pill">
            <span class="administrador-pill-texto">
                <i class="fa-solid fa-user-shield"></i>
                ADMINISTRADOR ● SERVICIOS ESCOLARES
            </span>
        </div>

        <section class="greeting-section">
            <div class="greeting-header">
                <h1>Hola, <span th:text="${nombre}">Administrador</span></h1>
                <p>Sesión de administrador activa.</p>
            </div>
        </section>

        <section class="card login-form-card">
            <p>Las rutas del panel están protegidas. Si cierras sesión, cualquier acceso volverá al login.</p>
            <a th:href="@{/logout}" class="btn-primary" style="margin-top:1rem;display:inline-flex;text-decoration:none;">
                <span>Cerrar sesión</span>
                <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
            </a>
        </section>
    </div>
</main>
</body>
</html>
